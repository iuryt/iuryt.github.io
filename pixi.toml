[workspace]
authors = ["iury simoes-sousa <iuryt@pm.me>"]
channels = ["conda-forge"]
name = "iuryt.github.io"
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]
version = "0.1.0"

[tasks]
preview = "quarto preview --port 4242"
render = "quarto render && cp -v pubs.bib docs/"
optimize-images = "for f in img/research/*.png img/research/*.jpg; do [ -f \"$f\" ] && magick \"$f\" -resize '1200x1200>' -quality 85 \"${f%.*}.webp\" && rm \"$f\"; done"

[dependencies]
quarto = ">=1.8"
python = ">=3.14.4,<3.15"
jupyter = ">=1.1.1,<2"
matplotlib = ">=3.10.8,<4"
xarray = ">=2026.4.0,<2027"
cdsapi = ">=0.7.7,<0.8"
h5netcdf = ">=1.8.1,<2"
hvplot = ">=0.12.2,<0.13"
pytz = ">=2023.3.post1,<2024"

[pypi-dependencies]
meteostat = ">=2.1.4,<3"

[target.linux-64.dependencies]
imagemagick = ">=7.1.2_21,<8"

[target.osx-arm64.dependencies]
imagemagick = ">=7.1.2_21,<8"

[target.osx-64.dependencies]
imagemagick = ">=7.1.2_21,<8"
